<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">TechZone</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-header">
            <h2>Contact Us</h2>
            <p>Have a question? Send us a message.</p>
        </section>

        <section class="contact-section">

            <div class="contact-info">
                <h3>Get In Touch</h3>

                <p><strong>Email:</strong> techzone@gmail.com</p>
                <p><strong>Phone:</strong> 0912-345-6789</p>
                <p><strong>Address:</strong> Cagayan de Oro City</p>

            </div>

            <form class="contact-form">

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Enter your message"></textarea>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 TechZone. All Rights Reserved.</p>
    </footer>

</body>
</html>
